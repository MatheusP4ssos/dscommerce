spring.application.name=dscommerce
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.sql.init.mode=never

server.port=${PORT:8081}

security.jwt.secret=${JWT_SECRET:}
security.jwt.ephemeral=false
security.jwt.duration=${JWT_DURATION:900}
security.jwt.issuer=${JWT_ISSUER:dscommerce}

cors.origins=${CORS_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never